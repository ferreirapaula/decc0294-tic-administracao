<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales by region: 2009 to 2011</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 24px 40px;
    background: #ffffff;
    color: #222;
  }
  .page {
    max-width: 920px;
    margin: 0 auto;
  }
  .title {
    font-size: 20px;
    font-weight: bold;
    margin: 0 0 2px 0;
    letter-spacing: 0.2px;
  }
  .subtitle {
    font-size: 13px;
    color: #666;
    margin: 0 0 26px 0;
  }
  svg {
    display: block;
    background: #ffffff;
  }
  .axis-label {
    font-size: 12px;
    fill: #666;
    text-anchor: middle;
  }
  .source {
    font-size: 11px;
    fill: #666;
  }
</style>
</head>
<body>
<div class="page">
  <div class="title">Sales by region: 2009 to 2011</div>
  <div class="subtitle">US$ billion</div>

  <svg width="920" height="500" viewBox="0 0 920 500" xmlns="http://www.w3.org/2000/svg">
    <!--
      Value -> Y scale: domain [0.6, 3.6], range [350, 55]
      y(value) = 350 - (value - 0.6) * 98.33
      Left (2009) dot x = 250   Right (2011) dot x = 440
      Region names left-aligned x=95 ; 2009 values right-aligned end x=235
      2011 values left-aligned x=452
    -->

    <!-- Lines (drawn first so dots/labels sit on top) -->
    <!-- Region A: 3.5 -> 3.1 (black) -->
    <line x1="250" y1="65" x2="440" y2="104" stroke="#1a1a1a" stroke-width="2.5"/>
    <!-- Region C: 3.3 -> 3.4 (gray) -->
    <line x1="250" y1="85" x2="440" y2="75" stroke="#8c8c8c" stroke-width="2"/>
    <!-- All Other: 2.7 -> 2.8 (gray) -->
    <line x1="250" y1="144" x2="440" y2="134" stroke="#8c8c8c" stroke-width="2"/>
    <!-- Region B: 2.4 -> 2.5 (gray) -->
    <line x1="250" y1="173" x2="440" y2="163" stroke="#8c8c8c" stroke-width="2"/>
    <!-- Region D: 2.1 -> 2.6 (blue) -->
    <line x1="250" y1="203" x2="440" y2="153" stroke="#2f77b8" stroke-width="2.5"/>
    <!-- Region E: 0.9 -> 1.4 (blue) -->
    <line x1="250" y1="321" x2="440" y2="271" stroke="#2f77b8" stroke-width="2.5"/>
    <!-- Region F: 0.7 -> 1.1 (blue) -->
    <line x1="250" y1="340" x2="440" y2="301" stroke="#2f77b8" stroke-width="2.5"/>

    <!-- Dots (2009 left, 2011 right) -->
    <g fill="#1a1a1a">
      <circle cx="250" cy="65" r="4"/>
    </g>
    <g fill="#8c8c8c">
      <circle cx="250" cy="85" r="4"/>   <!-- C -->
      <circle cx="250" cy="144" r="4"/>  <!-- All Other -->
      <circle cx="250" cy="173" r="4"/>  <!-- B -->
    </g>
    <g fill="#2f77b8">
      <circle cx="250" cy="203" r="4"/>  <!-- D -->
      <circle cx="250" cy="321" r="4"/>  <!-- E -->
      <circle cx="250" cy="340" r="4"/>  <!-- F -->
    </g>
    <g fill="#1a1a1a">
      <circle cx="440" cy="104" r="4"/>  <!-- A end -->
    </g>
    <g fill="#8c8c8c">
      <circle cx="440" cy="75" r="4"/>   <!-- C end -->
      <circle cx="440" cy="134" r="4"/>  <!-- All Other end -->
      <circle cx="440" cy="163" r="4"/>  <!-- B end -->
    </g>
    <g fill="#2f77b8">
      <circle cx="440" cy="153" r="4"/>  <!-- D end -->
      <circle cx="440" cy="271" r="4"/>  <!-- E end -->
      <circle cx="440" cy="301" r="4"/>  <!-- F end -->
    </g>

    <!-- Left labels: region names -->
    <text x="95" y="68" font-size="15" font-weight="bold" fill="#1a1a1a">Region A</text>
    <text x="95" y="88" font-size="15" font-weight="bold" fill="#222">Region C</text>
    <text x="95" y="147" font-size="15" font-weight="bold" fill="#222">All Other</text>
    <text x="95" y="176" font-size="15" font-weight="bold" fill="#222">Region B</text>
    <text x="95" y="206" font-size="15" font-weight="bold" fill="#222">Region D</text>
    <text x="95" y="324" font-size="15" font-weight="bold" fill="#2f77b8">Region E</text>
    <text x="95" y="343" font-size="15" font-weight="bold" fill="#2f77b8">Region F</text>

    <!-- Left labels: 2009 values (right-aligned, ending at x=235) -->
    <text x="235" y="68" font-size="15" text-anchor="end" fill="#1a1a1a" font-weight="bold">$3.5</text>
    <text x="235" y="88" font-size="15" text-anchor="end" fill="#222">$3.3</text>
    <text x="235" y="147" font-size="15" text-anchor="end" fill="#222">$2.7</text>
    <text x="235" y="176" font-size="15" text-anchor="end" fill="#222">$2.4</text>
    <text x="235" y="206" font-size="15" text-anchor="end" fill="#222">$2.1</text>
    <text x="235" y="324" font-size="15" text-anchor="end" fill="#2f77b8">$0.9</text>
    <text x="235" y="343" font-size="15" text-anchor="end" fill="#2f77b8">$0.7</text>

    <!-- Right labels: 2011 values (left-aligned at x=452) -->
    <text x="452" y="78" font-size="15" fill="#8c8c8c">$3.4</text>
    <text x="452" y="107" font-size="15" fill="#1a1a1a" font-weight="bold">$3.1</text>
    <text x="452" y="137" font-size="15" fill="#8c8c8c">$2.8</text>
    <text x="452" y="156" font-size="15" fill="#2f77b8">$2.6</text>
    <text x="452" y="166" font-size="15" fill="#8c8c8c">$2.5</text>
    <text x="452" y="274" font-size="15" fill="#2f77b8">$1.4</text>
    <text x="452" y="304" font-size="15" fill="#2f77b8">$1.1</text>

    <!-- X axis -->
    <line x1="250" y1="388" x2="440" y2="388" stroke="#bbb" stroke-width="1"/>
    <text x="250" y="408" class="axis-label">2009</text>
    <text x="440" y="408" class="axis-label">2011</text>

    <!-- Source -->
    <text x="95" y="442" class="source">Source: Sales Dashboard, as of 12/31/09 and 12/31/11</text>
  </svg>

  <!-- Callout 1 -->
  <div style="margin-top: 34px; max-width: 370px;">
    <div style="font-size: 16px; font-weight: bold; color: #111; margin-bottom: 6px;">Sales in Region A decreased</div>
    <div style="font-size: 15px; color: #333; line-height: 1.45;">an average of 5% per year<br>between 2009 and 2011.</div>
  </div>

  <!-- Callout 2 -->
  <div style="margin-top: 30px; max-width: 380px;">
    <div style="font-size: 16px; color: #333; margin-bottom: 6px;">In contrast, sales in Regions</div>
    <div style="font-size: 16px; font-weight: bold; color: #2f77b8; margin-bottom: 6px;">D, E, and F increased</div>
    <div style="font-size: 15px; color: #333; line-height: 1.45;">during the same period.</div>
  </div>
</div>
</body>
</html>
